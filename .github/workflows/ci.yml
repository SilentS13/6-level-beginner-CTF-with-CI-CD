name: CyberQuest CTF CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          if [ -f level-6/requirements.txt ]; then
            pip install -r level-6/requirements.txt
          fi

      - name: ✅ Check Python Syntax
        run: |
          python -m py_compile level-6/app.py

      - name: 📂 Verify Project Structure
        run: |
          test -d level-1
          test -d level-2
          test -d level-3
          test -d level-4
          test -d level-5
          test -d level-6

      - name: 🌐 Check HTML Files
        run: |
          find . -name "*.html"

      - name: 🎉 Success
        run: echo "All checks passed successfully!"
