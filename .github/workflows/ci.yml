name: CTF Security & Linting

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit
        if [ -f web-ctf-challenge/level-6/requirements.txt ]; then pip install -r web-ctf-challenge/level-6/requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 web-ctf-challenge/level-6/app.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 web-ctf-challenge/level-6/app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Security scan with Bandit
      run: |
        # This will scan for common security issues. 
        # Note: It will likely find the intentional vulnerability in Level 6!
        # We use -v to see the details.
        bandit -r web-ctf-challenge/level-6/app.py -v || true
