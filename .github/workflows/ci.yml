name: CyberQuest CTF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python Dependencies
        run: |
          if [ -f level-6/requirements.txt ]; then
            pip install -r level-6/requirements.txt
          fi

      - name: ✅ Check Python Syntax
        run: |
          python -m py_compile level-6/app.py

      - name: 📂 Verify Required Levels
        run: |
          for level in level-{1..6}; do
            test -d "$level"
            echo "✔ Found $level"
          done

      - name: 🌐 Verify HTML Files
        run: |
          find . -name "*.html"

      - name: 📄 Verify README Exists
        run: |
          test -f README.md

      - name: 📄 Verify CONTRIBUTING Guide
        run: |
          test -f CONTRIBUTING.md

      - name: 🎉 Build Successful
        run: echo "CyberQuest CTF validation completed successfully!"
