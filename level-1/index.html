<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 1: The Hidden Path</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align:center;
            padding:50px;
            background:#f0f0f0;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            display:inline-block;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
            width:500px;
        }

        input{
            width:80%;
            padding:10px;
            margin-top:20px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            margin-top:15px;
            padding:10px 20px;
            border:none;
            background:#2ecc71;
            color:white;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#27ae60;
        }

        #resultMsg{
            margin-top:20px;
            font-weight:bold;
            font-size:18px;
        }

        a{
            display:inline-block;
            margin-top:25px;
            text-decoration:none;
            color:#3498db;
            font-weight:bold;
        }

        a:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Level 1: The Hidden Path</h1>

    <p>Welcome to the CTF! The flag for this level is hidden somewhere on this page.</p>

    <p>Can you find it?</p>

    <!-- The flag is right here! CTF{inspect_element_is_step_one} -->

    <hr>

    <h2>🏁 Submit Your Flag</h2>

    <input
        type="text"
        id="flagInput"
        placeholder="Enter Flag (CTF{...})">

    <br>

    <button onclick="submitFlag()">
        Submit Flag
    </button>

    <p id="resultMsg"></p>

    <a href="../index.html">
        ⬅ Back to Dashboard
    </a>

</div>

<script>

function submitFlag(){

    const correctFlag="CTF{inspect_element_is_step_one}";

    const userFlag=document.getElementById("flagInput").value.trim();

    const result=document.getElementById("resultMsg");

    if(userFlag===correctFlag){

        localStorage.setItem("solved-level-1","true");

        result.style.color="#2ecc71";

        result.innerHTML="✅ Correct! Level 1 Completed.";

    }

    else{

        result.style.color="#e74c3c";

        result.innerHTML="❌ Incorrect Flag. Try Again.";

    }

}

</script>

</body>
</html>
