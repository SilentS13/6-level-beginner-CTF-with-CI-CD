<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 1: The Hidden Path</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            padding:50px;
            background:#f0f0f0;
        }

        .container{
            background:#fff;
            padding:30px;
            border-radius:10px;
            display:inline-block;
            box-shadow:0 4px 10px rgba(0,0,0,.1);
            width:500px;
        }

        input{
            width:80%;
            padding:10px;
            margin-top:20px;
        }

        button{
            margin-top:15px;
            padding:10px 20px;
            background:#2ecc71;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:#27ae60;
        }

        #resultMsg{
            margin-top:15px;
            font-weight:bold;
        }

        .back{
            display:inline-block;
            margin-top:25px;
            text-decoration:none;
            color:#3498db;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Level 1: The Hidden Path</h1>

    <p>Welcome to the CTF! The flag for this level is hidden somewhere on this page.</p>

    <p>Can you find it?</p>

    <!-- The flag is right here! CTF{inspect_element_is_step_one} -->

    <hr>

    <h2>🏁 Submit Flag</h2>

    <input
        type="text"
        id="flagInput"
        placeholder="Enter Flag">

    <br>

    <button onclick="submitFlag()">
        Submit
    </button>

    <p id="resultMsg"></p>

    <a class="back" href="../index.html">⬅ Back to Dashboard</a>

</div>

<script>

function submitFlag(){

    const correctFlag="CTF{inspect_element_is_step_one}";

    const entered=document.getElementById("flagInput").value.trim();

    const result=document.getElementById("resultMsg");

    if(entered===correctFlag){

        localStorage.setItem("solved-level-1","true");

        result.style.color="green";

        result.innerHTML="✅ Correct! Level 1 Solved.";

    }

    else{

        result.style.color="red";

        result.innerHTML="❌ Incorrect Flag.";

    }

}

</script>

</body>
</html>
