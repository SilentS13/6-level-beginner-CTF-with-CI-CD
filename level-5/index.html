<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 5: The Encoded Message</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #e8f5e9; }
        .container { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .encoded { font-family: monospace; background: #eee; padding: 10px; border-radius: 4px; display: block; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Level 5: The Encoded Message</h1>
        <p>Data is often encoded to make it easier to transmit, but it's not the same as encryption!</p>
        <p>Can you decode this message?</p>
        <code class="encoded">Q1RGe2Jhc2U2NF9pc19ldmVyeXdoZXJlfQ==</code>
        <p>Hint: It looks like it ends with <code>==</code>, which is a common padding for a specific encoding.</p>
    </div>
</body>
</html>
